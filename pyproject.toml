[project]
name = "rails49-classifier"
version = "0.1.0"
description = "Cut patches from a camera frame and score them with the rails49 occupancy classifier"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3", "onnxruntime>=1.31.1"]

[project.optional-dependencies]
openvino = ["openvino>=2026.4"]
train = [
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "pillow>=12.0",
    # Pinned to one version: org ADR 0022.
    "rails49-r49==0.2.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.urls]
Repository = "https://github.com/rails49/classifier"
Issues = "https://github.com/rails49/classifier/issues"

[project.scripts]
export = "classifier.export:main"
train = "classifier.train:main"

[dependency-groups]
dev = [
    "black>=25.1",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "rails49-classifier[openvino,train]",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classifier"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
